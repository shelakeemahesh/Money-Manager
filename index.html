<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CredoWallet | Personal Wealth & Finance Manager</title>
    <meta name="description" content="CredoWallet is a premium personal wealth management console to track incomes, expenses, budgets, AI insights, and friends ledger." />
    <meta name="keywords" content="finance, wealth manager, budget, income, expense, money tracker, personal finance, AI budget, friends ledger, credowallet" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CredoWallet | Personal Wealth & Finance Manager" />
    <meta property="og:description" content="CredoWallet is a premium personal wealth management console to track incomes, expenses, budgets, AI insights, and friends ledger." />
    <meta property="og:image" content="/assets/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="CredoWallet | Personal Wealth & Finance Manager" />
    <meta property="twitter:description" content="CredoWallet is a premium personal wealth management console to track incomes, expenses, budgets, AI insights, and friends ledger." />
    <meta property="twitter:image" content="/assets/og-image.png" />
    <script>
      // Polyfill global for sockjs-client or other older packages
      window.global = window;

      // Early runtime/eval error capture to prevent blank page without diagnostics
      window.addEventListener('error', (event) => {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 5px; margin: 20px; font-family: sans-serif;">
              <h3 style="margin-top: 0;">⚠️ Uncaught Module Load Error:</h3>
              <pre style="white-space: pre-wrap; word-break: break-all; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 3px;">${event.error ? event.error.stack : event.message}</pre>
              <p style="margin-bottom: 0; font-size: 14px;">This diagnostic overlay is displayed because the UI failed to render at module evaluation time.</p>
            </div>
          `;
        }
      });

      window.addEventListener('unhandledrejection', (event) => {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 5px; margin: 20px; font-family: sans-serif;">
              <h3 style="margin-top: 0;">⚠️ Unhandled Promise Rejection:</h3>
              <pre style="white-space: pre-wrap; word-break: break-all; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 3px;">${event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : 'Unknown promise rejection'}</pre>
              <p style="margin-bottom: 0; font-size: 14px;">This diagnostic overlay is displayed because the UI failed to render.</p>
            </div>
          `;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
