<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — CredoWallet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #09090b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #000000; color: #fafafa; }
      .card { background: #09090b; border-color: #1f1f23; }
      .subtitle { color: #a1a1aa; }
      .btn { background: #fafafa; color: #09090b; border-color: #fafafa; }
      .btn:hover { opacity: 0.9; }
      .icon-bg { background: #18181b; border-color: #27272a; }
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }

    .icon-bg {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon-bg svg {
      width: 32px;
      height: 32px;
      color: #a1a1aa;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #52525b;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .safe-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #09090b;
      color: #ffffff;
      border: 1px solid #09090b;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s ease;
      width: 100%;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .logo-text {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      letter-spacing: 0.04em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon-bg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
      </div>

      <h1>You're Offline</h1>
      <p class="subtitle">
        It looks like your internet connection was lost. CredoWallet needs a network connection to sync your financial data securely.
      </p>

      <div class="safe-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Your data is safe
      </div>

      <button class="btn" onclick="window.location.reload()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Try Again
      </button>

      <p class="logo-text">CredoWallet</p>
    </div>
  </div>
</body>
</html>
